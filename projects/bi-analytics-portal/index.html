<!DOCTYPE html>
<!--
  ==========================================================================
  BI ANALYTICS PORTAL  -  index.html  (the "shell" of the application)
  ==========================================================================
  This file contains ONLY the fixed frame of the app:
    - left sidebar (navigation)
    - top bar (global filters)
    - a "sub bar" (drill-down breadcrumb + active filter chips)
    - an empty <main> area where JavaScript draws each dashboard page

  Everything inside <main> (cards, KPI tiles, charts, tables) is created by
  js/app.js. This is how real single-page applications (SPAs) work.

  NOTE: We use plain <script> tags (not ES modules) so the project works by
  simply double-clicking index.html. ES modules are blocked on file:// URLs.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page scale correctly on phones/tablets -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BI Analytics Portal</title>
  <!-- All the styling lives in one CSS file -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="app">

    <!-- ================= LEFT SIDEBAR ================= -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-name">BI Portal</span>
      </div>
      <!-- The menu links are generated by app.js from the PAGES list -->
      <nav id="nav" aria-label="Dashboard pages"></nav>
      <div class="side-foot">Sample data is generated in your browser. No server needed.</div>
    </aside>

    <!-- ================= RIGHT SIDE ================= -->
    <div class="content">

      <!-- Top bar: page title + the global filters -->
      <header class="topbar">
        <button id="menuBtn" class="menu-btn" aria-label="Open menu">&#9776;</button>
        <h1 id="pageTitle">Executive Overview</h1>

        <!-- Each <select> is one filter. app.js fills in the <option> list. -->
        <div class="filters" id="filters">
          <label>Year
            <select id="f-year"></select>
          </label>
          <label>Quarter
            <select id="f-quarter"></select>
          </label>
          <label>Month
            <select id="f-month"></select>
          </label>
          <label>Region
            <select id="f-region"></select>
          </label>
          <label>Category
            <select id="f-category"></select>
          </label>
          <label>Channel
            <select id="f-channel"></select>
          </label>
          <button id="resetBtn" class="btn">Reset filters</button>
        </div>
      </header>

      <!-- Sub bar: shows "All years > 2024 > Q2" and clickable filter chips -->
      <div class="subbar" id="subbar"></div>

      <!-- Dashboard pages are drawn here -->
      <main class="main" id="main">
        <p class="loading">Preparing data&hellip;</p>
      </main>
    </div>
  </div>

  <!-- One shared tooltip element, moved around by charts.js -->
  <div id="tooltip" class="tooltip" hidden></div>

  <!--
    Script ORDER matters (each file uses the one before it):
      1. data.js   -> creates the sample dataset  (DataStore)
      2. charts.js -> chart drawing library        (Charts, Fmt)
      3. app.js    -> pages, filters, drill-down   (uses both above)
  -->
  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
