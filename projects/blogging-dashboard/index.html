<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blogging Platform</title>
    <meta
      name="description"
      content="A writing dashboard for your community blog: write, track and share posts."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("bp_theme");
          if (!t) {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="boot" class="boot" role="status"><span class="boot-dot"></span> Loading…</div>

    <!-- ============ AUTH ============ -->
    <div id="auth" class="auth hidden">
      <aside class="auth-side">
        <div class="auth-brand">Blogging Platform</div>
        <div>
          <h1 class="auth-title">A quiet place to keep writing.</h1>
          <p class="auth-copy">
            Draft, publish and watch your habit grow. Every post you write
            lights up a square.
          </p>
          <div id="auth-art" class="heat auth-heat" aria-hidden="true"></div>
        </div>
        <p class="auth-foot">Built by Gurwinder Parhar</p>
      </aside>

      <main class="auth-main">
        <div class="auth-card">
          <div class="tabs" role="tablist" aria-label="Account">
            <button
              type="button"
              role="tab"
              id="tab-login"
              class="tab active"
              data-action="auth-tab"
              data-tab="login"
              aria-selected="true"
            >
              Log in
            </button>
            <button
              type="button"
              role="tab"
              id="tab-signup"
              class="tab"
              data-action="auth-tab"
              data-tab="signup"
              aria-selected="false"
            >
              Create account
            </button>
          </div>

          <p id="auth-note" class="auth-note"></p>

          <form id="login-form" data-form="login" novalidate>
            <label class="field">
              <span>Email</span>
              <input type="email" id="login-email" autocomplete="email" required />
            </label>
            <label class="field">
              <span>Password</span>
              <input
                type="password"
                id="login-password"
                autocomplete="current-password"
                required
              />
            </label>
            <label class="check">
              <input type="checkbox" data-action="toggle-pass" data-target="login-password" />
              <span>Show password</span>
            </label>
            <p class="form-error" id="login-error" role="alert"></p>
            <button type="submit" class="btn primary block">Log in</button>
            <button type="button" id="forgot-btn" class="link-btn hidden" data-action="forgot">Forgot your password?</button>
          </form>

          <form id="signup-form" data-form="signup" class="hidden" novalidate>
            <label class="field">
              <span>Name</span>
              <input type="text" id="signup-name" autocomplete="name" required />
            </label>
            <label class="field">
              <span>Email</span>
              <input type="email" id="signup-email" autocomplete="email" required />
            </label>
            <label class="field">
              <span>Password</span>
              <input
                type="password"
                id="signup-password"
                autocomplete="new-password"
                minlength="8"
                required
              />
              <small>At least 8 characters.</small>
            </label>
            <label class="check">
              <input type="checkbox" data-action="toggle-pass" data-target="signup-password" />
              <span>Show password</span>
            </label>
            <p class="form-error" id="signup-error" role="alert"></p>
            <button type="submit" class="btn primary block">Create account</button>
          </form>
        </div>
      </main>
    </div>

    <!-- ============ APP ============ -->
    <div id="app" class="app hidden">
      <header class="topbar">
        <button
          type="button"
          class="icon-btn"
          data-action="nav-toggle"
          aria-label="Open menu"
          aria-controls="sidebar"
        ></button>
        <span class="topbar-title">Blogging Platform</span>
        <a class="btn primary small" href="#/write">Write</a>
      </header>

      <aside id="sidebar" class="sidebar" aria-label="Main navigation">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>Blogging Platform</span>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="side-foot">
          <p id="mode-note" class="mode-note"></p>
          <div class="me">
            <span class="avatar" id="me-avatar" aria-hidden="true"></span>
            <span class="me-text">
              <strong id="me-name"></strong>
              <small id="me-email"></small>
            </span>
          </div>
          <div class="side-actions">
            <button type="button" class="side-btn" data-action="theme" id="theme-btn"></button>
            <button type="button" class="side-btn" data-action="logout" id="logout-btn"></button>
          </div>
        </div>
      </aside>
      <div class="scrim-nav" data-action="nav-toggle"></div>

      <main id="view" class="view" aria-live="polite"></main>
    </div>

    <div id="modal-root"></div>
    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

    <script src="firebase-config.js"></script>
    <script src="scripts.js"></script>
  </body>
</html>
